name: okta-guardrails
description: Okta-aware guardrails and a who-gains/who-loses access preview for Terraform plans
inputs:
  plan:
    description: Path to `terraform show -json` output
    required: true
  population:
    description: Users file for the access-impact preview (optional)
    required: false
    default: ""
  fail-on:
    description: Lowest severity that fails the check (info, low, medium, high, critical)
    required: false
    default: high
  max-change:
    description: Largest membership change one PR may make before it is flagged
    required: false
    default: "50"
  comment:
    description: Post the report as a pull request comment ("true"/"false")
    required: false
    default: "true"
outputs:
  report:
    description: Path to the Markdown report
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - id: run
      shell: bash
      run: |
        set +e
        args=(check --plan "${{ inputs.plan }}" --fail-on "${{ inputs.fail-on }}" --max-change "${{ inputs.max-change }}" --output okta-guardrails.md)
        if [ -n "${{ inputs.population }}" ]; then args+=(--population "${{ inputs.population }}"); fi
        okta-guardrails "${args[@]}"
        code=$?
        cat okta-guardrails.md >> "$GITHUB_STEP_SUMMARY"
        echo "report=okta-guardrails.md" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = '<!-- okta-guardrails -->\n' + fs.readFileSync('okta-guardrails.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const mine = comments.find(c => c.body && c.body.startsWith('<!-- okta-guardrails -->'));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - shell: bash
      run: exit ${{ steps.run.outputs.code }}
