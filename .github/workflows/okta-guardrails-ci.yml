name: okta-guardrails ci

on:
  push:
    branches: [main]
    paths: ["okta-guardrails/**", ".github/workflows/okta-guardrails-*.yml"]
  pull_request:
    paths: ["okta-guardrails/**", ".github/workflows/okta-guardrails-*.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: okta-guardrails

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  demo:
    # Runs the tool against the demo plans so every PR shows a real report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python scripts/gen_population.py > fixtures/population.json
      - name: Risky plan must be blocked
        run: |
          set +e
          okta-guardrails check --plan fixtures/plan_risky.json --population fixtures/population.json \
            --output report.md
          code=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 1
      - name: Clean plan must pass
        run: okta-guardrails check --plan fixtures/plan_clean.json --population fixtures/population.json
      - name: SARIF is valid 2.1.0
        run: |
          set +e
          okta-guardrails check --plan fixtures/plan_risky.json --format sarif --output risky.sarif
          set -e
          pip install --quiet jsonschema
          curl -sSfL https://json.schemastore.org/sarif-2.1.0.json -o sarif-schema.json
          python -c "import json,jsonschema; d=json.load(open('risky.sarif')); jsonschema.validate(d, json.load(open('sarif-schema.json'))); assert d['runs'][0]['results']; print('SARIF ok:', len(d['runs'][0]['results']), 'results')"
      - uses: actions/upload-artifact@v4
        with:
          name: okta-guardrails-demo-sarif
          path: okta-guardrails/risky.sarif

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [baseline, live-smoke]
    defaults:
      run:
        working-directory: okta-guardrails/examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
